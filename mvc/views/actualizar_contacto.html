$def with (contacto)

$if contacto != []:
    <h2>Actualizar contacto</h2>
    <form name="contacto" method="GET" action="/contactos">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" value="$contacto['nombre']"><br>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" value="$contacto['email']"><br>

        <label for="telefono">Teléfono</label>
        <input type="tel" name="telefono" id="telefono" value="$contacto['telefono']"><br>

        <button type="button" name="actualizar" id="actualizar">Actualizar</button>
        <button type="submit" name="regresar" id="regresar">Regresar</button>
    </form>

$else:
    <h2>Contacto no encontrado</h2>
    <a href="/contactos">Regresar</a>
