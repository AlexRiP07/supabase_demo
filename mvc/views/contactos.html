$def with (datos)
<h1>Contactos</h1>

<a href="/insertar_contacto">Nuevo contacto</a>

<table>
    <thead>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Teléfono</th>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>Dejah</td>
            <td>dejah@email.cm</td>
            <td>11111111</td>
        </tr>
        $for contacto in datos:
            <tr>
                <td>$contacto['id_contacto']</td>
                <td>$contacto['nombre']</td>
                <td>$contacto['email']</td>
                <td>$contacto['telefono']</td>
            </tr>
    </tbody>
</table>
<a href="/">Index</a>
